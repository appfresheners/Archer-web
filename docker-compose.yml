services:
  archer:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    #     NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    #     PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    #     DATABASE_URI: ${DATABASE_URI}
    image: ghcr.io/appfresheners/archer:latest
    environment:
      AI_PROVIDER: ${AI_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.archer.rule=Host(`archer.homelab`)'
      - traefik.http.routers.archer.service=archer
      - traefik.http.services.archer.loadbalancer.server.port=3000
      - traefik.http.routers.archer.entrypoints=https
      - traefik.http.routers.archer.tls=true
      - traefik.http.routers.archer.tls.certresolver=letsencrypt
      # HTTP → HTTPS redirect
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-catchall.entrypoints=http
      - 'traefik.http.routers.http-catchall.rule=HostRegexp(`{any:.+}`)'
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
        - /app/.next/cache:uid=1001,gid=1001
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '1536M'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
